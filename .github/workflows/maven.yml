# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: List artifacts
      run: ls -R target

    # 上传 shaded 版本
    - name: Upload shaded jar
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./target/SpecialSource-1.11.6-SNAPSHOT-shaded.jar
        asset_name: SpecialSource-1.11.6-SNAPSHOT-shaded-${{ github.ref_name }}.jar
        asset_content_type: application/java-archive

    # 上传 shaded_proguard_base 版本
    - name: Upload shaded_proguard_base jar
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./target/SpecialSource-1.11.6-SNAPSHOT-shaded_proguard_base.jar
        asset_name: SpecialSource-1.11.6-SNAPSHOT-shaded_proguard_base-${{ github.ref_name }}.jar
        asset_content_type: application/java-archive

    # 上传普通 jar
    - name: Upload normal jar
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./target/SpecialSource-1.11.6-SNAPSHOT.jar
        asset_name: SpecialSource-1.11.6-SNAPSHOT-${{ github.ref_name }}.jar
        asset_content_type: application/java-archive
    
