# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'       # 例如 v1.0.0 会触发发布
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: List artifacts
      run: ls -R target

    - name: Create or update release and upload artifacts
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref_name }}                    # 当前 tag（例如 v1.11.6）
        name: Release ${{ github.ref_name }}           # Release 名
        allowUpdates: true                             # 已存在则更新
        artifacts: |
          target/SpecialSource-1.11.6-SNAPSHOT-shaded.jar,
          target/SpecialSource-1.11.6-SNAPSHOT-shaded_proguard_base.jar,
          target/SpecialSource-1.11.6-SNAPSHOT.jar
        artifactContentType: application/java-archive
